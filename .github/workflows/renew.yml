name: Auto-Renew PythonAnywhere

on:
  schedule:
    - cron: '0 8 1 */2 *'  # Every 2 months on the 1st
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Extend PythonAnywhere Webapp
        run: |
          python3 << 'EOF'
          import requests, re, sys

          USERNAME = "${{ secrets.PA_USERNAME }}"
          PASSWORD = "${{ secrets.PA_PASSWORD }}"
          DOMAIN   = "OmarSW.pythonanywhere.com"

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0"})

          # Step 1: Get CSRF token
          r = s.get("https://www.pythonanywhere.com/login/")
          csrf = re.search(r'name="csrfmiddlewaretoken" value="([^"]+)"', r.text)
          if not csrf:
              print("ERROR: no CSRF token"); sys.exit(1)
          csrf_token = csrf.group(1)
          print(f"CSRF: {csrf_token[:10]}...")

          # Step 2: Login
          r = s.post("https://www.pythonanywhere.com/login/", data={
              "csrfmiddlewaretoken": csrf_token,
              "auth-username": USERNAME,
              "auth-password": PASSWORD,
              "login_view-current_step": "auth",
          }, headers={"Referer": "https://www.pythonanywhere.com/login/"}, allow_redirects=True)

          if "/dashboard" not in r.url and "dashboard" not in r.text[:500]:
              print(f"ERROR: Login failed. URL={r.url}")
              print(r.text[:300])
              sys.exit(1)
          print("Logged in!")

          # Step 3: Extend
          csrf2 = s.cookies.get("csrftoken", csrf_token)
          r = s.post(
              f"https://www.pythonanywhere.com/user/{USERNAME}/webapps/{DOMAIN}/extend/",
              data={"csrfmiddlewaretoken": csrf2},
              headers={"Referer": f"https://www.pythonanywhere.com/user/{USERNAME}/webapps/"},
              allow_redirects=True
          )
          print(f"Extend status: {r.status_code}")
          if r.status_code in [200, 201, 302]:
              print("SUCCESS: Webapp extended!")
          else:
              print(f"Response: {r.text[:300]}")
              sys.exit(1)
          EOF
