name: Auto-Renew PythonAnywhere

on:
  schedule:
    - cron: '0 8 1 */2 *'  # Every 2 months on the 1st
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Extend PythonAnywhere Webapp
        run: |
          python3 << 'EOF'
          import requests, sys

          TOKEN    = "${{ secrets.PA_TOKEN }}"
          USERNAME = "OmarSW"
          DOMAIN   = "omarsw.pythonanywhere.com"

          headers = {"Authorization": f"Token {TOKEN}"}

          r = requests.post(
              f"https://www.pythonanywhere.com/api/v0/user/{USERNAME}/webapps/{DOMAIN}/extend/",
              headers=headers,
          )
          print(f"Status: {r.status_code}")
          print(f"Response: {r.text}")
          if r.status_code == 200:
              print("SUCCESS: Webapp extended!")
          else:
              print("FAILED")
              sys.exit(1)
          EOF
