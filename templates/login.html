<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LowCal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } .lowcal-logo { font-family: 'Playfair Display', Georgia, serif; }</style>
</head>
<body class="bg-gradient-to-br from-orange-50 to-amber-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
        <div class="text-center mb-7">
            <div class="flex flex-col items-center mb-1">
                <div class="lowcal-logo" style="font-size:48px;color:#2B3920;letter-spacing:4px;line-height:1.1;">
                    Lo<span style="font-size:20px;vertical-align:middle;margin:0 2px;">&#10022;</span>wcal
                </div>
                <div style="display:flex;align-items:center;gap:9px;margin-top:4px;">
                    <div style="width:50px;height:1px;background:#8B4030;"></div>
                    <span class="lowcal-logo" style="font-size:10px;color:#8B4030;letter-spacing:3px;">Healthy Meals</span>
                    <div style="width:50px;height:1px;background:#8B4030;"></div>
                </div>
            </div>
            <p class="text-gray-400 text-sm mt-2">Subscription Management</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 px-4 py-3 rounded-lg text-sm font-semibold bg-red-50 text-red-700 border border-red-200">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required autofocus
                    class="w-full border border-gray-300 rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-base">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-orange-300 focus:border-orange-400 text-base">
            </div>
            <button type="submit"
                class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 active:bg-orange-700 transition text-base mt-2">
                Login
            </button>
        </form>
    </div>
</div>
</body>
</html>
